name: On-Demand Secret Scan

on:
  workflow_dispatch:
  pull_request:
#   push:
#     branches: [ main ]

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Crucial: fetch-depth 0 pulls the full commit history

      # If triggered by a Pull Request, scan only the PR commits
      - name: TruffleHog Scan (Pull Request)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      # If triggered manually (workflow_dispatch) or by direct push, scan full history
      - name: TruffleHog Scan (Full History)
        if: github.event_name != 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified